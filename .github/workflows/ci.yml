name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and quality tools
        run: |
          python -m pip install uv==0.13.0
          uv sync --frozen --extra dev --extra research --extra experiments
      - name: Lint
        run: uv run --no-sync python -m ruff check .
      - name: Format check
        run: uv run --no-sync python -m ruff format --check .
      - name: Type check
        run: uv run --no-sync python -m mypy src
      - name: Tests
        run: uv run --no-sync python -m pytest
