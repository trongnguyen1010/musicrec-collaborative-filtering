[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "musicrec"
version = "0.1.0"
description = "Collaborative filtering-based music recommendation system."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Cao Trọng Nguyễn" },
  { name = "Lê Khắc Gia Khang" },
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.14,<2.0",
  "scikit-learn>=1.6,<2.0",
  "pyyaml>=6.0,<7.0",
  "pyarrow>=18.0,<20.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.42,<2.0"]
experiments = ["mlflow>=3.0,<4.0", "dvc>=3.60,<4.0"]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
  "mypy>=1.14,<2.0",
  "pre-commit>=4.1,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/musicrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["musicrec"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["requests"]
ignore_missing_imports = true
